<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E17"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <!-- Glow Accent -->
  <circle cx="1050" cy="120" r="300" fill="#2563EB" opacity="0.18" filter="blur(80px)"/>
  <circle cx="150" cy="500" r="240" fill="#3B82F6" opacity="0.12" filter="blur(60px)"/>

  <!-- Decorative Chart Line -->
  <path d="M 600,450 Q 750,400 850,320 T 1100,160" fill="none" stroke="url(#glow)" stroke-width="4" opacity="0.6"/>
  <circle cx="1100" cy="160" r="8" fill="#60A5FA"/>

  <!-- Brand Pill -->
  <rect x="80" y="80" width="340" height="42" rx="21" fill="rgba(37, 99, 235, 0.2)" stroke="rgba(59, 130, 246, 0.4)" stroke-width="1.5"/>
  <circle cx="106" cy="101" r="6" fill="#10B981"/>
  <text x="124" y="107" fill="#60A5FA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">LIVE PRIMARY MARKET INTEL</text>

  <!-- Main Headline -->
  <text x="80" y="210" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="-1">
    IPO Pricealerter
  </text>

  <!-- Tagline -->
  <text x="80" y="275" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500">
    Real-Time Indian IPO Analytics, Live GMP &amp; Allotment Gateways
  </text>

  <!-- Stat Cards Row -->
  <g transform="translate(80, 340)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="220" height="130" rx="16" fill="url(#card-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="24" y="55" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800">197+</text>
    <text x="24" y="95" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Tracked IPOs</text>

    <!-- Card 2 -->
    <rect x="250" y="0" width="220" height="130" rx="16" fill="url(#card-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="274" y="55" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800">6 Live</text>
    <text x="274" y="95" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Open for Bidding</text>

    <!-- Card 3 -->
    <rect x="500" y="0" width="220" height="130" rx="16" fill="url(#card-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="524" y="55" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800">Daily</text>
    <text x="524" y="95" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">GMP Trend Updates</text>

    <!-- Card 4 -->
    <rect x="750" y="0" width="270" height="130" rx="16" fill="url(#card-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    <text x="774" y="55" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800">Official</text>
    <text x="774" y="95" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Registrar Checkers</text>
  </g>

  <!-- Footer Domain -->
  <text x="80" y="550" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">
    Data from NSE • BSE • Chittorgarh • Verified Registrars • <tspan fill="#38BDF8">https://pricealerter.in</tspan>
  </text>
</svg>
