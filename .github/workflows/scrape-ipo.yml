name: Refresh IPO Guru cache

on:
  schedule:
    # Provider cache refresh. The scraper skips requests until the configured, rate-aware window expires.
    - cron: '45 3 * * 1-5'
    - cron: '15,45 4-9 * * 1-5'
    - cron: '0 10 * * 1-5'
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipo-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run scrape
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IPOGURU_API_KEY: ${{ secrets.IPOGURU_API_KEY }}
          IPOGURU_REFRESH_SECONDS: ${{ vars.IPOGURU_REFRESH_SECONDS || '300' }}
