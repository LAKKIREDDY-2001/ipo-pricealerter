name: Apply D1 migrations and deploy PriceAlerter

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricealerter-production-d1-migration
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret before running this workflow."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_ACCOUNT_ID repository secret before running this workflow."
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build production site
        run: npm run build

      - name: Apply pending D1 migrations
        run: npx --yes wrangler@4.164.0 d1 migrations apply pricealerter-db --remote --config wrangler.d1.example.toml

      - name: Verify D1 migration history
        run: npx --yes wrangler@4.164.0 d1 migrations list pricealerter-db --remote --config wrangler.d1.example.toml

      - name: Deploy production Pages site
        run: npx --yes wrangler@4.164.0 pages deploy dist --project-name=ipo-pricealerter --branch=main 
