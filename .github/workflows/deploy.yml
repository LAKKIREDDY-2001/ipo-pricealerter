name: Deploy static IPO website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Prepare static website
        run: |
          mkdir -p _site/data _site/blog
          cp index.html app.js styles.css favicon.svg _site/
          cp data/ipo-data.js _site/data/
          cp -f ads.txt sitemap.xml robots.txt 404.html about.html signup.html CNAME _headers _redirects _site/ 2>/dev/null || true
          cp -f blog/index.html _site/blog/ 2>/dev/null || true
          test -s _site/index.html
          test -s _site/app.js
          test -s _site/styles.css
          test -s _site/data/ipo-data.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
