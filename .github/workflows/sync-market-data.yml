name: Autonomous Market Data & IPO Pipeline Sync

on:
  schedule:
    # Every 15 minutes during Indian market hours (09:00 to 16:00 IST = 03:30 to 10:30 UTC, Mon-Fri)
    - cron: '*/15 3-10 * * 1-5'
    # Hourly during off-market weekday hours
    - cron: '0 0-2,11-23 * * 1-5'
    # Hourly on weekends
    - cron: '0 * * * 0,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-market:
    name: Sync Live Stock Quotes, Gainers, Losers, Shakers & IPOs
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync Live Market Data from Configured Quote Sources
        env:
          TAPETIDE_TOKEN: ${{ secrets.TAPETIDE_TOKEN }}
        run: |
          python3 scripts/sync_market_data.py --verbose

      - name: Audit IPO listing data consistency
        run: |
          python3 scripts/audit_ipo_listing_data.py || true

      - name: Commit and Push Updated Market Feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live-market-data.json data/ipo-data.js app.js data/listing-data-quality-report.json
          if ! git diff --staged --quiet; then
            git commit -m "Auto-sync live stock prices & market data every 10 min [skip ci]"
            git push origin main
            echo "✅ Successfully synced live market data to GitHub."
          else
            echo "ℹ️ No market price changes detected during this 10-minute interval."
          fi
